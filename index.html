    function getRelativePos(index, activeIdx, total) {
      let diff = (index - activeIdx + total) % total;
      if (diff > Math.floor(total / 2)) diff -= total;
      return diff;
    }

    function renderFanShowcase() {
      const fanStage = document.getElementById('fanStage');
      const bottomStrip = document.getElementById('bottomStrip');
      if (!fanStage || !bottomStrip) return;

      fanStage.innerHTML = '';

      const total = showcaseItems.length;

        const diff = getRelativePos(index, activeIndex, total);

        card.className = 'fan-card overflow-hidden bg-slate-900 border-2 ' + 
          (diff === 0 ? 'border-rose-400' : 'border-white/40');
        card.setAttribute('data-pos', diff);
        card.onclick = () => {
          if (diff === 0) {
            document.querySelector(item.target)?.scrollIntoView({ behavior: 'smooth' });
          } else {
            activeIndex = index;
            updateShowcasePositions();
          }

        card.innerHTML = `

    function updateShowcasePositions() {
      const cards = document.querySelectorAll('#fanStage .fan-card');
      const total = showcaseItems.length;
      cards.forEach((card, index) => {
        const diff = getRelativePos(index, activeIndex, total);
        card.setAttribute('data-pos', diff);
        card.className = 'fan-card overflow-hidden bg-slate-900 border-2 ' + 
          (diff === 0 ? 'border-rose-400' : 'border-white/40');
      });
      renderBottomStripOnly();
      updateActiveCaption();
    }

    function renderBottomStripOnly() {
      const bottomStrip = document.getElementById('bottomStrip');
      if (!bottomStrip) return;
      Array.from(bottomStrip.children).forEach((thumb, index) => {
        const isCurrent = index === activeIndex;
        thumb.className = `cursor-pointer group rounded-2xl p-3 transition-all border ${
          isCurrent 
            ? 'bg-white border-rose-400 shadow-md scale-[1.02]' 
            : 'bg-white/70 border-slate-200/80 hover:bg-white'
        }`;
      });
    }

    function updateActiveCaption() {
      const item = showcaseItems[activeIndex];
      const badgeEl = document.getElementById('captionBadge');
      if (!badgeEl || !item) return;

      badgeEl.textContent = `${item.badge} • ${item.period}`;
      badgeEl.className = `inline-block text-[11px] font-bold uppercase tracking-widest px-3 py-1 rounded-full text-white shadow-sm ${
        item.accent === 'rose' ? 'bg-rose-500' : 'bg-blue-600'
      }`;
      document.getElementById('captionTitle').textContent = item.title;
      document.getElementById('captionDesc').textContent = item.desc;
    }

    function rotateCarousel(step) {
      const total = showcaseItems.length;
      activeIndex = (activeIndex + step + total) % total;
      updateShowcasePositions();
    }

    function replayFanAnimation() {
      const fanStage = document.getElementById('fanStage');
      if (!fanStage) return;
      fanStage.classList.add('stacked');
      setTimeout(() => {
        fanStage.classList.remove('stacked');
      }, 650);
    }

    function pauseAutoRotate() {
      if (autoRotateTimer) clearInterval(autoRotateTimer);
    }

    function resumeAutoRotate() {
      pauseAutoRotate();
      autoRotateTimer = setInterval(() => rotateCarousel(1), 4200);

    function formatIDNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function renderTop10Table(dataList) {
      const tbody = document.getElementById('top10TableBody');
      if (!tbody) return;
      tbody.innerHTML = '';
      const maxEng = 93420;

      dataList.forEach((row) => {
        const pct = Math.round((row.engagement / maxEng) * 100);
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-rose-50/40 transition-colors';
        tr.innerHTML = `
          <td class="py-3.5 px-2 text-center font-bold text-slate-900">${row.rank}</td>
          <td class="py-3.5 px-3 font-semibold text-slate-900">${row.title}</td>
          <td class="py-3.5 px-2"><span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-rose-50 text-rose-600">${row.type}</span></td>
          <td class="py-3.5 px-3 text-slate-500">${row.date}</td>
          <td class="py-3.5 px-3 text-right font-medium text-slate-700">${formatIDNumber(row.views)}</td>
          <td class="py-3.5 px-4">
            <div class="relative w-full h-6 bg-slate-100 rounded-lg overflow-hidden flex items-center px-2.5">
              <div style="width: ${pct}%" class="absolute inset-y-0 left-0 bg-gradient-to-r from-blue-200 via-blue-300 to-rose-200 transition-all duration-500"></div>
              <span class="relative z-10 ml-auto font-bold text-slate-900 text-xs">${formatIDNumber(row.engagement)}</span>
            </div>
          </td>
          <td class="py-3.5 px-2 text-right font-bold ${row.er >= 8 ? 'text-rose-600' : 'text-blue-600'}">${row.er.toString().replace('.', ',')}%</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function sortTop10(criteria) {
      const copy = [...top10Data];
      if (criteria === 'views') copy.sort((a, b) => b.views - a.views);
      else if (criteria === 'er') copy.sort((a, b) => b.er - a.er);
      else copy.sort((a, b) => b.engagement - a.engagement);

      ['engagement', 'views', 'er'].forEach(key => {
        const btn = document.getElementById('sort-' + key);
        if (btn) {
          if (key === criteria) {
            btn.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition-all';
          } else {
            btn.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-rose-50 hover:text-rose-600 transition-all';
          }
        }
      });

      renderTop10Table(copy);
      renderViralReelsGrid(copy);
    }

    function renderWorkDocsGallery() {
      const container = document.getElementById('workDocsGalleryContainer');
      if (!container) return;

      workDocumentationItems.forEach((doc) => {
        const card = document.createElement('div');

      } else {
        grid.classList.add('hidden');
        grid.classList.remove('grid');
        btn.innerHTML = `<span>Show Work Documentation (${workDocumentationItems.length})</span><span class="iconify" data-icon="lucide:chevron-down"></span>`;

    // LIGHTBOX MODAL HELPERS
    function openLightbox(imgSrc, title, badge) {
      const modal = document.getElementById('imageLightbox');
      const img = document.getElementById('lightboxImg');
      const titleEl = document.getElementById('lightboxTitle');
      const badgeEl = document.getElementById('lightboxBadge');
      if (!modal || !img) return;

      img.src = imgSrc;
      titleEl.textContent = title || 'Preview';
      badgeEl.textContent = badge || 'Documentation';
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeLightbox() {
      const modal = document.getElementById('imageLightbox');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // COPY EMAIL HELPER
    function copyEmail(btn) {
      const email = btn.getAttribute('data-email') || 'career.syiifu@gmail.com';
      navigator.clipboard.writeText(email).then(() => {
        const span = btn.querySelector('.btn-text');
        const old = span.innerText;
        span.innerText = 'Email Copied!';
        setTimeout(() => { span.innerText = old; }, 2000);
      });
    }

    // INITIALIZE ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      renderFanShowcase();
      renderTop10Table(top10Data);
      renderViralReelsGrid(top10Data);
      renderCertGallery();
      renderWorkDocsGallery();

      const stage = document.getElementById('fanStage');
      if (stage) {
        setTimeout(() => {
          stage.classList.remove('stacked');
        }, 450);
      }

      resumeAutoRotate();

      const chapters = document.querySelectorAll('.chapter-3d');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          }
        });
      }, { threshold: 0.12 });

      chapters.forEach(ch => observer.observe(ch));
    });
  </script>
